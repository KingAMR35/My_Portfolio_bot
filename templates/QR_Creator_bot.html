<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mini App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='QR_Creator_bot.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="{{ url_for('static', filename='js/QR_Creator_bot.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="box">
        <h3>QR_Creator_bot</h3>
    </div>

    <button class="theme-toggle" id="theme-toggle" type="button">
        <span class="theme-icon"></span>
    </button>

    <main class="menu-list">
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Вставьте ссылку (https://...)" autocomplete="off">
            <button id="generateBtn" class="generate-btn">Сгенерировать QR</button>
        </div>
        
        <p id="errorMessage" class="error-message"></p>
        
        <div id="resultContainer" class="result-container">
            <div id="qrcode"></div>
            <p class="result-text">Ваш QR-код готов!</p>
            <button id="downloadBtn" class="download-btn">Поделиться</button>
            <p class="hint-text">💡 Также, если вы используете ПК или ноутбук, то вы можете нажать ПКМ по QR-CODE, чтобы сохранить</p>
        </div>
    </main>
</body>
</html>
