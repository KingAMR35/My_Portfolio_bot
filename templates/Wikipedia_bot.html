<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mini App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Wikipedia_bot.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="{{ url_for('static', filename='js/Wikipedia_bot.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
    <div class="box">
        <h3>Wikipedia_bot</h3>
    </div>

    <button class="theme-toggle" id="theme-toggle" type="button">
        <span class="theme-icon"></span>
    </button>

    <main class="wiki-main">
        <div class="wiki-search-box">
            <div class="wiki-input-wrapper">
                <span class="wiki-input-icon">🔍</span>
                <input 
                    type="text" 
                    id="wiki-search" 
                    class="wiki-input" 
                    placeholder="Введите тему для поиска..." 
                    maxlength="100"
                    autocomplete="off"
                >
                <button class="wiki-clear-btn" id="wiki-clear-btn" style="display: none;">✕</button>
            </div>
            <div class="wiki-char-counter" id="wiki-char-counter">0 / 100</div>
            
            <div class="wiki-buttons">
                <button class="wiki-btn wiki-btn-secondary" id="wiki-random-btn">
                    <span>🎲</span> Случайная статья
                </button>
                <button class="wiki-btn wiki-btn-primary" id="wiki-search-btn">
                    <span>🔍</span> Найти статью
                </button>
            </div>
        </div>

        <div class="wiki-loader" id="wiki-loader" style="display: none;">
            <div class="wiki-spinner"></div>
            <span>Ищем информацию...</span>
        </div>

        <div class="wiki-error" id="wiki-error" style="display: none;">
            <span>⚠️</span>
            <span id="wiki-error-text"></span>
        </div>

        <article class="wiki-result-card" id="wiki-result-card" style="display: none;">
            <div class="wiki-image-wrap" id="wiki-image-wrap" style="display: none;">
                <img src="" alt="" class="wiki-image" id="wiki-image">
                <div class="wiki-image-overlay"></div>
                <h2 class="wiki-title" id="wiki-title"></h2>
            </div>
            
            <div class="wiki-content-wrap">
                <h2 class="wiki-title-mobile" id="wiki-title-mobile" style="display: none;"></h2>
                <p class="wiki-summary" id="wiki-summary"></p>
                
                <div class="wiki-related" id="wiki-related" style="display: none;">
                    <span class="wiki-related-label">📚 Также интересно:</span>
                    <div class="wiki-related-list" id="wiki-related-list"></div>
                </div>

                <a href="#" target="_blank" class="wiki-read-more" id="wiki-read-more">
                    Читать полностью на Wikipedia →
                </a>
            </div>
        </article>
    </main>
</body>
</html>
